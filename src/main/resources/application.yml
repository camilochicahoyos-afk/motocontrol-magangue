server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: motocontrol-magangue
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/motocontrol}
    username: ${DB_USER:motocontrol}
    password: ${DB_PASSWORD:motocontrol123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: America/Bogota
    serialization:
      write-dates-as-timestamps: false

motocontrol:
  tarifa:
    minima: 2000
    maxima: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
