services:
  db:
    image: postgres:16-alpine
    container_name: motocontrol-db
    environment:
      POSTGRES_DB: motocontrol
      POSTGRES_USER: motocontrol
      POSTGRES_PASSWORD: motocontrol123
    ports:
      - "5432:5432"
    volumes:
      - motocontrol-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motocontrol -d motocontrol"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: motocontrol-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/motocontrol
      DB_USER: motocontrol
      DB_PASSWORD: motocontrol123
    ports:
      - "8080:8080"

volumes:
  motocontrol-data:
